name: quant
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy
  - pandas=2.2.2
  # PyTorch with CUDA support for RTX 4060
  - pytorch::pytorch>=2.0.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=11.8
  # Core dependencies
  - matplotlib=3.9.3
  - tqdm=4.67.1
  - einops=0.8.1
  
  # Pip dependencies
  - pip
  - pip:
    - huggingface_hub==0.33.1
    - transformers
    - accelerate
    - yfinance




